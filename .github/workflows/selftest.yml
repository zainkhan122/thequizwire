# Full toolchain self-test on a real runner (the only place with ffmpeg + chrome + docker): installs the toolchain,
# synthesises one Kokoro take, builds the template episode end-to-end and renders it to prove the pipeline.
# Nothing is published. Run manually or weekly; the first green run is the Phase-1 → Phase-2 hand-off.
# Private repo: manual only (≈25 billable minutes per run). Run after toolchain changes, not on a schedule.
name: selftest
on:
  workflow_dispatch:
    inputs:
      template:
        description: template episode to render (series/<name>)
        default: _template_v2
        required: false
env:
  TPL: ${{ github.event.inputs.template || '_template_v2' }}
  PYTHONUNBUFFERED: "1"
  HYPERFRAMES_NO_TELEMETRY: "1"
  HYPERFRAMES_NO_UPDATE_CHECK: "1"
  DO_NOT_TRACK: "1"
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5          # pinned interpreter: the runner image jumped to 3.14 on 2026-11-11 and the TTS stack had no wheels
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/hyperframes
            ~/.cache/pip
            ~/.cache/huggingface
            ~/.cache/kokoro
            ~/.cache/geodata
          key: tools-hf0.8.137-${{ runner.os }}-${{ hashFiles('reelkit/ci_setup.sh', 'reelkit/geodata.py') }}
      - name: Toolchain
        run: bash reelkit/ci_setup.sh
      - name: YouTube worker offline (unit tests + dry-run plan on the committed ledger, no secrets)
        run: |
          python3 tests/test_yt_enrich.py
          env -u YT_CLIENT_ID -u YT_CLIENT_SECRET -u YT_REFRESH_TOKEN python3 reelkit/yt_enrich.py run --dry-run | tail -2
      - name: Kokoro smoke (am_michael, one sentence → wav + whisper round-trip)
        run: python3 reelkit/tts_kokoro.py --selftest
      - name: Template episode, every stage incl. render (RELEASE=0 so the estimated timeline is allowed)
        run: |
          set -o pipefail
          GEOLINT_ONLINE=1 bash reelkit/episode.sh "series/$TPL" 2>&1 | tee "$RUNNER_TEMP/pipeline.log"
          bash reelkit/episode.sh "series/$TPL" snap 2>&1 | tee -a "$RUNNER_TEMP/pipeline.log"
          grep -E "^== \[|rendered in|text units|dead-zone|\"pass\"" "$RUNNER_TEMP/pipeline.log" | sed 's/^/  /' > "series/$TPL/out/pipeline_summary.txt" || true
      - name: Map animator image pulls (maptile engine prerequisite)
        run: docker pull ghcr.io/versatiles-org/versatiles-map-animator:latest && docker run --rm ghcr.io/versatiles-org/versatiles-map-animator:latest --help 2>&1 | head -60 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-${{ github.run_number }}
          path: |
            series/${{ env.TPL }}/out/*.json
            series/${{ env.TPL }}/out/final.mp4
            series/${{ env.TPL }}/out/cover.jpg
            /home/runner/.cache/build/${{ env.TPL }}/snaps
          if-no-files-found: ignore
          retention-days: 7
