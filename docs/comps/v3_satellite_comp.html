<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:Anton;src:url(Anton-Regular.ttf)} @font-face{font-family:Oswald;src:url(Oswald.ttf)}
html,body{margin:0;background:#000} #frame{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Oswald,sans-serif;color:#fff}
#map{position:absolute;left:0;top:0;transform-origin:0 0} #map img{display:block} #map svg{position:absolute;left:0;top:0;overflow:visible}
.scrim-top{position:absolute;left:0;top:0;width:1080px;height:760px;background:linear-gradient(180deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.45) 55%,rgba(0,0,0,0) 100%)}
.scrim-bot{position:absolute;left:0;bottom:0;width:1080px;height:700px;background:linear-gradient(0deg,rgba(0,0,0,.78) 0%,rgba(0,0,0,.35) 60%,rgba(0,0,0,0) 100%)}
.bug{position:absolute;left:48px;top:232px;background:#C8102E;color:#fff;font:600 30px/1 Oswald;letter-spacing:.14em;padding:14px 20px;border-radius:10px;text-transform:uppercase}
.q{position:absolute;left:60px;right:60px;top:330px;font:400 104px/1.04 Anton;text-transform:uppercase;text-align:center;text-shadow:0 6px 0 rgba(0,0,0,.55),0 14px 30px rgba(0,0,0,.6)}
.q em{font-style:normal;color:#FFD400}
.opts{position:absolute;left:70px;right:70px;top:790px;display:flex;flex-direction:column;gap:26px}
.opt{display:flex;align-items:center;gap:30px;height:124px;background:rgba(10,16,28,.72);border:3px solid rgba(255,255,255,.35);border-radius:70px;padding:0 34px 0 22px;backdrop-filter:blur(6px);box-shadow:0 10px 30px rgba(0,0,0,.45)}
.opt .l{width:76px;height:76px;border-radius:50%;background:#fff;color:#0B1620;font:700 46px/76px Anton;text-align:center}
.opt .f{width:88px;height:88px;border-radius:50%;background-size:cover;background-position:center;border:3px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.opt .t{font:600 58px/1 Oswald;letter-spacing:.02em}
.opt.ok{background:#1E9E4A;border-color:#fff}
.opt.dim{opacity:.38}
.timer{position:absolute;left:0;right:0;top:1330px;text-align:center}
.timer .ring{display:inline-block;width:150px;height:150px;border-radius:50%;border:10px solid rgba(255,255,255,.25);border-top-color:#FFD400;border-right-color:#FFD400;box-sizing:border-box;position:relative}
.timer .n{position:absolute;left:0;right:0;top:22px;font:400 86px/1 Anton;color:#fff}
.tease{position:absolute;left:0;right:0;top:1510px;text-align:center;font:600 40px/1 Oswald;letter-spacing:.2em;color:#FFD400;text-transform:uppercase}
.cap{position:absolute;left:300px;right:40px;top:1270px;text-align:center;font:400 86px/1.05 Anton;text-transform:uppercase;text-shadow:0 5px 0 rgba(0,0,0,.6),0 12px 28px rgba(0,0,0,.7)}
.cap b{color:#FFD400;font-weight:400}
.big{position:absolute;left:60px;right:60px;top:300px;text-align:center;font:400 150px/1 Anton;color:#FFD400;text-shadow:0 8px 0 #7a4b00,0 18px 36px rgba(0,0,0,.7)}
.sub{position:absolute;left:60px;right:60px;top:470px;text-align:center;font:600 54px/1 Oswald;letter-spacing:.18em;text-transform:uppercase;text-shadow:0 4px 14px rgba(0,0,0,.8)}
.sticker{position:absolute;width:260px;height:260px;filter:drop-shadow(0 14px 22px rgba(0,0,0,.6))}
.credit{position:absolute;left:0;right:0;top:1545px;text-align:center;font:500 26px/1 Oswald;letter-spacing:.12em;color:rgba(255,255,255,.75)}
.pin{position:absolute;width:34px;height:34px;border-radius:50%;background:#FFD400;border:6px solid #fff;box-shadow:0 0 0 14px rgba(255,212,0,.35),0 6px 16px rgba(0,0,0,.6);transform:translate(-50%,-50%)}
