# One-shot: re-dispatch st08 to YouTube after Buffer's daily channel limit resets (deferred 2026-11-20: "daily posting limit reached").
# Runs before the 07:00 UTC daily run claims tomorrow's two YouTube slots. Delete this file once the ledger shows st08 youtube scheduled.
name: st08 youtube retry
on:
  schedule:
    - cron: '20 0 21 11 *'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - env: { GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}" }
        run: gh workflow run dispatch.yml -f episodes="series/geo-stories/st08-australia-wider-than-the-moon" -f tag="geo-stories-st08-v2-release" -f live=true -f channels="youtube"
