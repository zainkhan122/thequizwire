<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:Lilita;src:url(LilitaOne-Regular.ttf)} @font-face{font-family:Oswald;src:url(Oswald.ttf)} @font-face{font-family:Anton;src:url(Anton-Regular.ttf)}
html,body{margin:0;background:#000} #frame{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Lilita,sans-serif;color:#fff}
#map{position:absolute;left:0;top:0;transform-origin:0 0} #map img{display:block} #map svg{position:absolute;left:0;top:0;overflow:visible}
.bug{position:absolute;left:48px;top:232px;background:#fff;color:#C8102E;font:400 30px/1 Lilita;letter-spacing:.08em;padding:14px 20px;border-radius:14px;text-transform:uppercase;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.q{position:absolute;left:50px;right:50px;top:330px;font:400 100px/1.06 Lilita;text-transform:uppercase;text-align:center;color:#fff;
   -webkit-text-stroke:3px #1b1b1b;paint-order:stroke fill;text-shadow:0 8px 0 #1b1b1b,0 16px 28px rgba(0,0,0,.45)}
.q em{font-style:normal;color:#FFD400}
.opts{position:absolute;left:70px;right:70px;top:800px;display:flex;flex-direction:column;gap:26px}
.opt{display:flex;align-items:center;gap:28px;height:126px;background:#fff;border-radius:70px;padding:0 34px 0 20px;box-shadow:0 10px 0 #1b1b1b,0 22px 30px rgba(0,0,0,.35);color:#1b1b1b}
.opt .l{width:84px;height:84px;border-radius:50%;background:#FFD400;color:#1b1b1b;font:400 50px/84px Lilita;text-align:center;border:4px solid #1b1b1b;box-sizing:border-box}
.opt .f{width:90px;height:90px;border-radius:50%;background-size:cover;background-position:center;border:4px solid #1b1b1b;box-sizing:border-box}
.opt .t{font:400 60px/1 Lilita;letter-spacing:.02em}
.opt.ok{background:#2ECC71}
.timer{position:absolute;left:0;right:0;top:1330px;text-align:center}
.timer .ring{display:inline-block;width:160px;height:160px;border-radius:50%;background:#fff;border:10px solid #1b1b1b;box-sizing:border-box;position:relative;box-shadow:0 8px 0 #1b1b1b}
.timer .n{position:absolute;left:0;right:0;top:18px;font:400 96px/1 Lilita;color:#C8102E}
.tease{position:absolute;left:0;right:0;top:1510px;text-align:center;font:400 46px/1 Lilita;letter-spacing:.08em;color:#fff;text-transform:uppercase;-webkit-text-stroke:2px #1b1b1b;paint-order:stroke fill;text-shadow:0 5px 0 #1b1b1b}
.big{position:absolute;left:40px;right:40px;top:290px;text-align:center;font:400 136px/1 Lilita;color:#FFD400;text-transform:uppercase;-webkit-text-stroke:4px #4a2b00;paint-order:stroke fill;text-shadow:0 12px 0 #4a2b00,0 24px 40px rgba(0,0,0,.5)}
.sub{position:absolute;left:60px;right:60px;top:450px;text-align:center;font:400 56px/1 Lilita;letter-spacing:.12em;text-transform:uppercase;color:#fff;-webkit-text-stroke:2px #1b1b1b;paint-order:stroke fill;text-shadow:0 5px 0 #1b1b1b}
.cap{position:absolute;left:40px;right:40px;top:1270px;text-align:center;font:400 90px/1.05 Lilita;text-transform:uppercase;color:#fff;-webkit-text-stroke:3px #1b1b1b;paint-order:stroke fill;text-shadow:0 8px 0 #1b1b1b,0 16px 30px rgba(0,0,0,.45)}
.cap b{color:#FFD400;font-weight:400}
.sticker{position:absolute;filter:drop-shadow(0 14px 22px rgba(0,0,0,.45))}
.credit{position:absolute;left:0;right:0;top:1545px;text-align:center;font:500 26px/1 Oswald;letter-spacing:.12em;color:#1b1b1b;background:rgba(255,255,255,.55);width:620px;margin:0 auto;padding:8px 0;border-radius:20px}
.pin{position:absolute;width:38px;height:38px;border-radius:50%;background:#C8102E;border:6px solid #fff;box-shadow:0 0 0 12px rgba(200,16,46,.3),0 6px 16px rgba(0,0,0,.5);transform:translate(-50%,-50%)}
.pl{position:absolute;font:400 58px/1 Lilita;color:#fff;-webkit-text-stroke:2.5px #1b1b1b;paint-order:stroke fill;text-shadow:0 5px 0 #1b1b1b,0 10px 20px rgba(0,0,0,.5);white-space:nowrap}

<div id="frame"></div>

function ball(flag, x, y, r, face, rot){ // flag-ball character (own SVG): flag circle + eyes + mouth

             : face === "wow" ? `<ellipse cx="-32" cy="-20" rx="24" ry="30" fill="#fff"/><ellipse cx="32" cy="-20" rx="24" ry="30" fill="#fff"/><circle cx="-30" cy="-16" r="12"/><circle cx="34" cy="-16" r="12"/><ellipse cx="0" cy="46" rx="26" ry="32" fill="#1b1b1b"/><ellipse cx="0" cy="56" rx="16" ry="14" fill="#e0505a"/>`

  return `<svg class="sticker" style="left:${x - r}px;top:${y - r}px;transform:rotate(${rot || 0}deg)" width="${2 * r}" height="${2 * r}" viewBox="-110 -110 220 220">

    <g clip-path="url(#${id})"><image href="${flag}" x="-150" y="-110" width="300" height="220" preserveAspectRatio="xMidYMid slice"/></g>

function mapLayer(img, size, proj, cssScale, offset){
  const m = document.createElement("div"); m.id = "map"; m.style.transform = `translate(${offset[0]}px,${offset[1]}px) scale(${cssScale})`;

    const ao = L.proj([170.142, -43.595]); const X = v => v * 1.3 - 420, Y = v => v * 1.3 - 40;
