# Daily production (owner decision 2026-10-17): every day pick 1–3 ready episodes from the authored backlog, render them
# and dispatch to every channel at the best-performing slot per platform (config/publishing.json → buffer.scheduling),
# with the per-channel SEO copy from reelkit/postkit.py. Authoring stays with the agent: it writes episodes and flips
# `status: ready` once the gates pass and the frames were reviewed; this workflow only consumes the backlog.
name: daily
on:
  schedule:
    - cron: '0 7 * * *'          # 07:00 UTC = 12:00 PKT = 03:00 ET → renders done well before the first US slot
    - cron: '30 9 * * *'         # self-healing retry: GitHub skipped the 07:00 run on 2026-10-21; daily_pick --if-unplanned makes this a no-op when 07:00 ran
  workflow_dispatch:
    inputs:
      min: {description: 'min episodes', default: '1'}
      max: {description: 'max episodes', default: '3'}
permissions:
  contents: write
  actions: write
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Gate toolchain   # quizlint's cover gate imports Pillow; 11-28 a bare runner SKIPped every episode as "backlog empty"
        run: python3 -c "import PIL, cairosvg" 2>/dev/null || python3 -m pip install -q pillow cairosvg 2>/dev/null || python3 -m pip install -q --break-system-packages pillow cairosvg
      - name: Channel stats first (what performed, which hours)
        continue-on-error: true     # a Buffer 429 / API hiccup must never stop the pick
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_API_KEY_2: ${{ secrets.BUFFER_API_KEY_2 }}
        run: |
          python3 tools/stats.py snapshot 2>&1 | tail -8 | tee -a "$GITHUB_STEP_SUMMARY"
          python3 tools/slots.py apply 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Pick today's episodes
        id: p
        run: |
          EPS="$(python3 tools/daily_pick.py --if-unplanned --min "${{ inputs.min || '1' }}" --max "${{ inputs.max || '3' }}")" || { echo "::error::daily_pick crashed (see above) — a crash must not look like an empty backlog"; exit 1; }
          echo "eps=$EPS" >> "$GITHUB_OUTPUT"
          echo "### Daily pick $(date -u +%F): ${EPS:-— backlog empty}" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$EPS" ]; then
            # already planned (09:30 retry) or backlog empty. Self-heal: if today's render run failed, re-run its failed jobs.
            TODAY=$(date -u +%F)
            gh run list -w render.yml -L 8 --json databaseId,conclusion,createdAt,displayTitle -q ".[] | select(.createdAt >= \"${TODAY}T00:00:00Z\") | select(.conclusion==\"failure\" or .conclusion==\"cancelled\") | .databaseId" | while read -r RID; do
              echo "::warning::render run $RID failed today — re-running failed jobs"; gh run rerun "$RID" --failed || true
            done
            echo "::warning::nothing new to render today (already planned or backlog empty — author episodes with status: ready)"; exit 0
          fi
          git config user.name quizwire-daily; git config user.email daily@users.noreply.github.com
          git add dispatch/daily.json dispatch/stats.json dispatch/stats_summary.json dispatch/stats.md config/publishing.json && git commit -qm "daily: plan $(date -u +%F) [skip ci]" && git stash -q --include-untracked 2>/dev/null || true; ok=0; for i in 1 2 3 4 5; do git pull --rebase -q -X theirs && git push -q && { ok=1; break; } || { git rebase --abort 2>/dev/null; sleep $((i*7)); }; done; git stash drop -q 2>/dev/null || true; [ "$ok" = 1 ] || { echo "::error::could not push ledger after 5 tries"; git status -sb; exit 1; }
      - name: Render + dispatch (live, best-time slots)
        if: steps.p.outputs.eps != ''
        run: |
          gh workflow run render.yml -f episodes="${{ steps.p.outputs.eps }}" -f tag="daily-$(date -u +%F)" -f dispatch=true -f sha="$(git rev-parse HEAD)"
          echo "render.yml started for: ${{ steps.p.outputs.eps }}" >> "$GITHUB_STEP_SUMMARY"
