# Repo hygiene on every push: code compiles, shell parses, NO media/bloat in git, and every committed episode passes the
# offline gates (quizlint, geolint, facts, provenance, voice plan) — the same checks reelkit/episode.sh runs before a render.
# Private repo budget: runs only on main, skips doc-only pushes, cancels a superseded run (≈2 billable minutes per run).
name: check
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/img/**'
      - 'STATE.json'
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: reelkit/ci_setup.sh
      - name: Light Python deps (offline gates + procedural score; the full toolchain is ci_setup.sh in render/selftest)
        run: python3 -m pip install -q numpy scipy soundfile pillow pyyaml
      - name: Python compiles
        run: python3 -m compileall -q reelkit engine tools tests
      - name: Shell parses
        run: for f in $(git ls-files '*.sh'); do bash -n "$f"; done
      - name: Size guard
        run: python3 tools/repo_guard.py
      - name: Map runtime unit tests (d3-geo projections, clipExtent, world-atlas ids)
        run: node tests/test_geo_runtime.mjs
      - name: Self-test (template + disputed-border fixture through plan → geo → compose → static → quizlint → geolint → facts → provenance)
        run: python3 tests/selftest.py
      - name: Committed episodes — offline gates
        run: |
          set -e
          for q in $(git ls-files 'series/*/*/episode.json'); do
            ep=$(dirname "$q"); case "$ep" in series/_template*) continue;; esac
            # shipped episodes passed every gate at render time and cannot change; the catalogue-relative gates (Q22 stem, Q24 SHOW set)
            # would otherwise fail them retroactively whenever a NEWER episode ships — lint only what can still be edited
            st=$(python3 -c "import json;print(json.load(open('$q')).get('status',''))"); case "$st" in sent|scheduled|published) echo "== $ep (shipped · skipped)"; continue;; esac
            if [ -f dispatch/daily.json ] && python3 -c "import json,sys;d=json.load(open('dispatch/daily.json'))['days'];sys.exit(0 if any('$ep' in v for v in d.values()) else 1)"; then echo "== $ep (planned/shipped via daily.json · skipped)"; continue; fi
            if [ ! -f "$ep/topic.md" ]; then echo "== $ep (legacy, pre topic-protocol · skipped)"; continue; fi
            echo "== $ep"
            python3 reelkit/plan.py "$ep" --estimate >/dev/null
            python3 reelkit/quizlint.py "$ep"
            python3 reelkit/voice.py check "$ep" --plan-only
            python3 reelkit/factcheck.py "$ep" --hf /nonexistent
            python3 reelkit/provenance.py "$ep" --hf /nonexistent
          done
