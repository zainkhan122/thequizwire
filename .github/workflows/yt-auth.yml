name: yt-auth (one-off)
on:
  workflow_dispatch:
    inputs:
      agent_pubkey:
        description: agent one-time X25519 public key (base64)
        required: true
jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      AGENT_PUBKEY: ${{ inputs.agent_pubkey }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pynacl
      - run: python3 tools/yt_auth_ci.py
